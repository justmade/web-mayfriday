# mayinfriday.icdiary.com —— 首次签发证书前的临时 HTTP 配置
# 上传时覆盖为 /etc/nginx/conf.d/mayinfriday.icdiary.com.conf。
# 证书签发成功后,再用同目录的正式 HTTPS 配置覆盖它。

log_format admin_safe '$remote_addr - [$time_local] "$request_method $uri" '
                      '$status $body_bytes_sent "$http_user_agent"';

server {
    listen 80;
    listen [::]:80;
    server_name mayinfriday.icdiary.com;

    root /var/www/web-mayfriday/dist;
    client_max_body_size 2m;

    gzip on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
        try_files $uri =404;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ~* ^/(images|files)/ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location = /healthz {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        access_log /var/log/nginx/mayinfriday-api.log admin_safe;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
