# mayinfriday.com —— 生产站点配置(主域名)
#
# 安装位置:/etc/nginx/conf.d/mayinfriday.com.conf
# 依赖:
#   - /etc/nginx/conf.d/00-shared.conf 提供 log_format admin_safe 与 limit_req_zone
#   - 证书软链在 /etc/nginx/ssl/mayinfriday.com/{fullchain.pem,privkey.pem}
#     证书须同时覆盖 mayinfriday.com 和 www.mayinfriday.com
#
# 旧域名 mayinfriday.icdiary.com 的配置只做 301 跳转,见同目录另一个文件。

# www → 裸域名。单独一个 server 块,跳转前先完成 TLS 握手,
# 所以证书必须包含 www,否则用户先看到的是证书错误而不是跳转。
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.mayinfriday.com;

    ssl_certificate     /etc/nginx/ssl/mayinfriday.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/mayinfriday.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    return 301 https://mayinfriday.com$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name mayinfriday.com www.mayinfriday.com;

    # Let's Encrypt / certbot 的 HTTP-01 验证必须走明文 80,放在跳转之前
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
    }

    # Reject secret-file probes before the normal HTTP-to-HTTPS redirect.
    location ~* (^|/)\.git(?:/|$) { return 404; }
    location ~* (^|/)\.(?:svn|hg)(?:/|$) { return 404; }
    location ~* (^|/)\.env(?:\.[^/]*)?$ { return 404; }
    location ~* ^/(?:terraform\.tfvars|tencent\.yml|qcloud\.yml|oss\.yml|credentials\.json)$ { return 404; }

    # 固定跳裸域名,顺手把 www 的明文请求一次收敛到位
    location / {
        return 301 https://mayinfriday.com$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name mayinfriday.com;

    ssl_certificate     /etc/nginx/ssl/mayinfriday.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/mayinfriday.com/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    root /var/www/web-mayfriday/dist;

    # Never let the SPA fallback turn secret-file probes into successful 200s.
    location ~* (^|/)\.git(?:/|$) { return 404; }
    location ~* (^|/)\.(?:svn|hg)(?:/|$) { return 404; }
    location ~* (^|/)\.env(?:\.[^/]*)?$ { return 404; }
    location ~* ^/(?:terraform\.tfvars|tencent\.yml|qcloud\.yml|oss\.yml|credentials\.json)$ { return 404; }

    # 与 server.js 的 express.json({ limit: '2mb' }) 对齐
    client_max_body_size 2m;

    gzip on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_vary on;
    # 必须同时列出 text/javascript:Nginx 1.25 起 .js 的默认 MIME 从
    # application/javascript 改为 text/javascript(见 mime.types)。只写前者
    # 会导致主 JS 包完全不压缩——本站实测 988KB 未压 vs 304KB 已压。
    gzip_types text/plain text/css text/javascript application/javascript
               application/json image/svg+xml;

    # 构建产物带内容 hash,可长缓存
    # 用单条 add_header 而非 expires + add_header,避免下发两个 Cache-Control 头
    location /assets/ {
        add_header Cache-Control "public, immutable, max-age=31536000" always;
        try_files $uri =404;
    }

    # 图片和下载文件不带 hash,给较短缓存
    location ~* ^/(images|files)/ {
        add_header Cache-Control "public, max-age=604800" always;
        try_files $uri =404;
    }

    location = /healthz {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    # HLS 播放令牌必须放在 URL 中兼容 iOS 原生播放器，短期令牌也不写 access log。
    location = /api/hls-playlist {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        access_log off;
    }

    location ~ ^/api/(login|register)$ {
        limit_req zone=auth_api burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        access_log /var/log/nginx/mayinfriday-api.log admin_safe;
    }

    location = /api/send-sms-code {
        limit_req zone=sms_api burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        access_log /var/log/nginx/mayinfriday-api.log admin_safe;
    }

    # API 反代 —— 必须在 location / 之前,否则请求会被 SPA fallback 吞掉返回 HTML
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        access_log /var/log/nginx/mayinfriday-api.log admin_safe;
    }

    # SPA history fallback —— 等价于原 vercel.json 的 rewrite
    location / {
        try_files $uri $uri/ /index.html;
    }
}
