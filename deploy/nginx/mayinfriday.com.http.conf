# mayinfriday.com —— 签发证书前的临时 HTTP 配置
#
# 安装位置:/etc/nginx/conf.d/mayinfriday.com.conf
# 用途:只为 certbot 的 HTTP-01 验证放行 /.well-known/acme-challenge/。
#
# 刻意保持最小:此时服务器上仍是旧域名的完整配置,里面已经定义了
# log_format admin_safe 和两个 limit_req_zone。本文件若重复定义或引用
# 它们会直接撞 duplicate / unknown zone,nginx -t 失败。
#
# 证书签发成功后,用 mayinfriday.com.conf 覆盖本文件(同时替换旧域名配置
# 并装上 00-shared.conf),再 nginx -t && systemctl reload nginx。

server {
    listen 80;
    listen [::]:80;
    server_name mayinfriday.com www.mayinfriday.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
        try_files $uri =404;
    }

    # 站点此时还没正式切过来,其余路径一律 404,不要暴露任何内容。
    location / {
        return 404;
    }
}
