# http 上下文共享指令 —— 安装位置:/etc/nginx/conf.d/00-shared.conf
#
# log_format 和 limit_req_zone 在整个 http 上下文只能定义一次。站点配置从
# 单域名扩到多域名后,这些指令若留在各自的站点配置里会撞 duplicate,
# nginx -t 直接失败、reload 被拒。统一抽到这里,站点配置只负责引用。
#
# 文件名的 00- 前缀保证它在 conf.d 里最先被加载(nginx 按字母序 include)。

# API 日志不记录 query string。管理员密码现在只走请求头;同时避免其他短期令牌
# 意外进入日志。
log_format admin_safe '$remote_addr - [$time_local] "$request_method $uri" '
                      '$status $body_bytes_sent "$http_user_agent"';

# Keep abuse controls on the small API surface only. $binary_remote_addr is the
# actual peer address; X-Forwarded-For is client-controlled at the edge.
limit_req_zone $binary_remote_addr zone=auth_api:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=sms_api:10m rate=10r/m;
