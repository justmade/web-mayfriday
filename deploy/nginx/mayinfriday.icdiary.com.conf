# mayinfriday.icdiary.com —— 旧域名,只做 301 跳转到 mayinfriday.com
#
# 安装位置:/etc/nginx/conf.d/mayinfriday.icdiary.com.conf
# 依赖:证书软链仍在 /etc/nginx/ssl/mayinfriday.icdiary.com/
#
# 站点本体已迁到 mayinfriday.com.conf。这里只保留跳转,两件事不能省:
#
# 1. 443 必须继续监听并挂着有效证书。TLS 握手发生在 HTTP 301 之前,
#    老用户访问 https://mayinfriday.icdiary.com 时若证书缺失或过期,
#    浏览器先弹安全警告,根本走不到跳转。
# 2. 80 上的 /.well-known/acme-challenge/ 必须放在跳转之前。否则 certbot
#    续期时 HTTP-01 验证被 301 带走、续期失败,三个月后旧证书过期,
#    退化成上面第 1 条的故障。
#
# 这两条意味着旧域名的 DNS 和证书都要继续维护,不能在切换后立刻下掉。
#
# 跳转用 $request_uri 保留完整路径和 query,老用户的深链接(课程页、
# 激活页)都能落到新域名的同一个位置。
#
# 注意:登录态存在 localStorage,按 origin 隔离,跳过去不会带过来。
# 老用户需要在新域名重新登录,课程权限按手机号存在服务端,不受影响。
# 新域名上有一条说明横幅,见 src/components/common/DomainNoticeBanner.jsx。

server {
    listen 80;
    listen [::]:80;
    server_name mayinfriday.icdiary.com;

    # 续期验证,必须在跳转之前
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
    }

    location / {
        return 301 https://mayinfriday.com$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name mayinfriday.icdiary.com;

    ssl_certificate     /etc/nginx/ssl/mayinfriday.icdiary.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/mayinfriday.icdiary.com/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    return 301 https://mayinfriday.com$request_uri;
}
